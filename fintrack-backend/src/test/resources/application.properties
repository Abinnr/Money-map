spring.datasource.url=jdbc:h2:mem:fintrack_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=test-only-super-secret-jwt-key-minimum-32-bytes-long!
jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:5173
app.security.auth-rate-limit.max-attempts=5
app.security.auth-rate-limit.window-seconds=60