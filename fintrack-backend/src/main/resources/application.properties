spring.application.name=fintrack-backend

#Database Configuration (defaults for local dev; override via env vars)
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fintrack}
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:pass123}

#JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

#JWT Configuration
jwt.secret=${JWT_SECRET:fintrack-super-secret-key-for-development-only-123456789}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS (comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Auth Rate Limiting
app.security.auth-rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX:10}
app.security.auth-rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW:60}


